name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    name: Windows x64 checks
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare locked official dependency
        run: .\third_party\prepare.ps1
      - name: Build Release and verify hosted test inventory
        run: |
          .\tools\build.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          .\tools\test-hosted.ps1 -BuildDirectory build/windows-release
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-test-reports
          path: artifacts/hosted-tests/
          if-no-files-found: warn
          retention-days: 14
