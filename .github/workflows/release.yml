name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v prefix, for example 0.1.0-beta.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME.Substring(1) } else { $env:REQUESTED_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') { throw 'Invalid version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Prepare locked official dependency
        run: .\third_party\prepare.ps1
      - name: Build Release and run hosted tests
        run: |
          .\tools\build.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          .\tools\test-hosted.ps1 -BuildDirectory build/windows-release
      - name: Package and verify archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: .\tools\package.ps1 -Version $env:RELEASE_VERSION -BuildDirectory build/windows-release
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: |
            artifacts/releases/${{ steps.version.outputs.version }}/*.zip
            artifacts/releases/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release
          path: dist
      - name: Verify archive digest and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          # Refuse to publish an archive under a tag for a different source tree.
          # matching-refs returns an empty array for an absent tag; API failures
          # remain failures instead of being treated as missing tags.
          tag_ref="refs/tags/v$RELEASE_VERSION"
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$RELEASE_VERSION")
          tag_object=$(jq -c --arg ref "$tag_ref" '.[] | select(.ref == $ref) | .object' <<< "$refs")
          if [ -z "$tag_object" ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="$tag_ref" -f sha="$SOURCE_COMMIT" > /dev/null
          else
            depth=0
            while [ "$(jq -r '.type' <<< "$tag_object")" = tag ]; do
              depth=$((depth + 1))
              if [ "$depth" -gt 10 ]; then echo 'Tag nesting exceeds the supported limit' >&2; exit 1; fi
              tag_sha=$(jq -r '.sha' <<< "$tag_object")
              tag_object=$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object')
            done
            if [ "$(jq -r '.type' <<< "$tag_object")" != commit ] || [ "$(jq -r '.sha' <<< "$tag_object")" != "$SOURCE_COMMIT" ]; then
              echo 'Release tag does not match the built source commit' >&2
              exit 1
            fi
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Windows x64 预览版。下载并解压 ZIP，运行 3DGSDownloader.exe。

          - 无需登录，下载影石 3D 时光舱公开分享原文件。
          - 默认模型与 cameras.json，记忆保存目录和资源选择。
          - 任务列表、取消、重试、文件校验及重启恢复。
          - 包含 GUI、CLI、Skia 运行依赖和许可证；不包含用户数据。

          运行要求：Windows x64、最新版 Microsoft Visual C++ v14 x64 运行库、支持所需扩展的 Vulkan 显卡驱动。该版本尚未进行代码签名。

          构建由 GitHub Actions 完成。托管测试不包含 Vulkan 窗口呈现及人工 UI 检查；发布前需在支持的 Windows 设备上核验此包。

          不支持登录链接、格式转换、3D 预览或跨进程断点续传。
          NOTES
          gh release create "v$RELEASE_VERSION" "3DGSDownloader-$RELEASE_VERSION-windows-x64.zip" SHA256SUMS --verify-tag --draft --prerelease --title "3DGSDownloader v$RELEASE_VERSION · Windows x64" --notes-file "$RUNNER_TEMP/release-notes.md"
